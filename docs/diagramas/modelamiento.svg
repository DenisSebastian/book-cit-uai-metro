<text x="77" y="391" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700">4</text>
<text x="112" y="377" fill="#0f172a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">Revisar dependencia</text>
<text x="112" y="404" fill="#475569" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15">vecindad y residuos</text>
<line x1="340" y1="424" x2="340" y2="449" stroke="#64748b" stroke-width="2.5"/>
<polygon points="333,446 340,456 347,446" fill="#64748b"/>
