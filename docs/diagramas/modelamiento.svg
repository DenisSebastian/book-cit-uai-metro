<text x="112" y="487" fill="#0f172a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">Interpretar límites</text>
<text x="112" y="514" fill="#475569" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15">incertidumbre y escala</text>
