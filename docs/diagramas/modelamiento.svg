<text x="112" y="267" fill="#0f172a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">Estimar relaciones</text>
<text x="112" y="294" fill="#475569" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15">modelo de referencia</text>
<line x1="340" y1="314" x2="340" y2="339" stroke="#64748b" stroke-width="2.5"/>
<polygon points="333,336 340,346 347,336" fill="#64748b"/>
