<text x="112" y="157" fill="#0f172a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">Preparar variables</text>
<text x="112" y="184" fill="#475569" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15">fuentes y exposición</text>
<line x1="340" y1="204" x2="340" y2="229" stroke="#64748b" stroke-width="2.5"/>
<polygon points="333,226 340,236 347,226" fill="#64748b"/>
