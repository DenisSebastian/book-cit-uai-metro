<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 568" width="680" height="568" role="img" lang="es" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">De la pregunta al resultado espacial</title>
<desc id="diagram-desc">Flujo de cinco pasos para orientar el análisis.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
