<text x="112" y="47" fill="#0f172a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">Definir hecho</text>
<text x="112" y="74" fill="#475569" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15">ámbito, unidad y periodo</text>
